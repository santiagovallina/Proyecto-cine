<nav class="navbar">
  <a routerLink="/" class="navbar__brand">🎬 Cine</a>

  <ul class="navbar__links">
    <li><a routerLink="/cartelera" routerLinkActive="activo">Cartelera</a></li>
    <li><a routerLink="/candy" routerLinkActive="activo">Candy</a></li>
    <li><a routerLink="/complejo" routerLinkActive="activo">Complejo</a></li>
  </ul>

  <div class="navbar__usuario">
    <button
      type="button"
      class="navbar__usuario-boton"
      aria-label="Cuenta de usuario"
      [attr.aria-expanded]="menuAbierto()"
      (click)="alternarMenu()"
    >
      👤
    </button>

    @if (menuAbierto()) {
      <div class="navbar__menu">
        @if (!auth.cargando()) {
          @if (auth.logueado()) {
            <p class="navbar__saludo">Hola, {{ auth.perfil()?.nombre || 'usuario' }}</p>
            <button type="button" class="navbar__opcion" (click)="cerrarSesion()">Cerrar sesión</button>
          } @else {
            <a routerLink="/login" (click)="cerrarMenu()">Iniciar sesión</a>
            <a routerLink="/register" (click)="cerrarMenu()">Registrarse</a>
          }
        }
      </div>
    }
  </div>
</nav>
